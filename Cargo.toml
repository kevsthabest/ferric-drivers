[workspace]
resolver = "2"
members = ["crates/abi", "crates/gate1-svc", "crates/wifi-core", "crates/ferric-ntfs", "crates/ferric-exfat", "crates/ferric-vbe", "crates/ferric-ehci", "crates/ferric-pmu", "crates/ferric-sd", "crates/ferric-hw", "crates/ferric-res", "crates/ferric-i8255x", "crates/ferric-ethernet", "crates/ferric-cardbus"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
version = "0.1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
